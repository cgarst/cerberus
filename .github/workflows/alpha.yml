name: Alpha

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: alpha
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          base_version=$(node -p "require('./CerberusExpo/app.json').expo.version")
          build_id="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=${base_version}-alpha.${build_id}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      channel: alpha
      version: ${{ needs.prepare.outputs.version }}
      version_code: ${{ github.run_number }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Replace alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Automated alpha build of \`$GITHUB_SHA\`.

          - Version: \`${{ needs.prepare.outputs.version }}\`
          - Channel: \`alpha\`
          EOF
          gh release delete alpha --cleanup-tag --yes || true
          gh release create alpha artifacts/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Alpha ${{ needs.prepare.outputs.version }}" \
            --notes-file notes.md

  altstore-source:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/altstore-source.yml
