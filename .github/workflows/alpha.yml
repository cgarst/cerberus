name: Alpha

on:
  push:
    branches: [master, main]
    paths:
      - 'CerberusExpo/**'
      - 'CerberusService/**'
      - 'CerberusService.Tests/**'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/alpha.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/altstore-source.yml'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: alpha
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          base_version=$(node -p "require('./CerberusExpo/app.json').expo.version")
          build_id="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=${base_version}-alpha.${build_id}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      channel: alpha
      version: ${{ needs.prepare.outputs.version }}
      version_code: ${{ github.run_number }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ needs.prepare.outputs.version }}"
          cat > notes.md <<EOF
          Automated alpha build of \`$GITHUB_SHA\`.

          - Version: \`${{ needs.prepare.outputs.version }}\`
          - Channel: \`alpha\`
          EOF
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" artifacts/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Alpha ${{ needs.prepare.outputs.version }}" \
            --notes-file notes.md

          # Remove legacy static 'alpha' release and prune old alpha releases (keep latest 5)
          gh release delete alpha --cleanup-tag --yes || true
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v.*-alpha\\."))] | sort_by(.createdAt) | reverse | .[5:][] | .tagName' \
            | while read -r old_tag; do
                [ -n "$old_tag" ] && gh release delete "$old_tag" --cleanup-tag --yes || true
              done

  altstore-source:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/altstore-source.yml

  update-manifest:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/update-manifest.yml
